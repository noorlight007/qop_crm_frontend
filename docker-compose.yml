x-frontend: &frontend
  build:
    context: .
    dockerfile: dockerfile
  image: qop-crm-frontend:latest
  restart: unless-stopped
  env_file:
    - .env.production
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000"]
    interval: 5s
    timeout: 3s
    retries: 10

services:
  frontend_a:
    <<: *frontend
    container_name: qop_frontend_a
    ports:
      - "5000:5000"

  frontend_b:
    <<: *frontend
    container_name: qop_frontend_b
    ports:
      - "5001:5000"
